<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="description" content="Free browser party games. No signup, no install — everyone plays on their own phone." />
  <title>Pixel Games — free browser party games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>" />
  <link rel="stylesheet" href="/portal.css" />
</head>
<body>
  <div id="page">

    <header class="hero">
      <div class="logo">🎮</div>
      <h1 id="hubTitle">Pixel Games</h1>
      <p id="hubTagline" class="tagline">Free browser party games.</p>
    </header>

    <div id="invite" class="invite hidden">
      <div>
        <b>You've been invited!</b>
        <div class="muted tiny">Room code <span id="inviteCode" class="mono"></span></div>
      </div>
      <button id="inviteBtn" class="btn primary">Join now</button>
    </div>

    <div id="filters" class="filters"></div>

    <main id="games" class="grid" aria-live="polite"></main>

    <p id="empty" class="muted center hidden">No games match that filter.</p>

    <footer class="foot">
      <span>Free forever · no accounts · no downloads</span>
      <a href="/health" hidden></a>
    </footer>
  </div>

  <!-- details modal -->
  <div id="modal" class="modal hidden">
    <div class="modalCard" role="dialog" aria-modal="true">
      <button id="closeBtn" class="closeBtn" aria-label="Close">✕</button>
      <div class="sheetHead">
        <div id="mEmoji" class="mEmoji">🎭</div>
        <div>
          <h2 id="mTitle">Title</h2>
          <p id="mTagline" class="muted"></p>
        </div>
      </div>

      <div id="mMeta" class="meta"></div>
      <p id="mDesc" class="desc"></p>

      <div class="cols">
        <div>
          <h3>How to play</h3>
          <ol id="mHow" class="list"></ol>
        </div>
        <div>
          <h3>Features</h3>
          <ul id="mFeatures" class="list"></ul>
        </div>
      </div>

      <a id="mPlay" class="btn primary big" href="#">▶ Play now</a>
      <p class="muted tiny center">Opens the game — you'll get a room code to share.</p>
    </div>
  </div>

  <script src="/portal.js"></script>
</body>
</html>
