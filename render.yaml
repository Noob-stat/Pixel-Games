# One-click free deploy on Render (https://render.com).
# In Render: New + > Blueprint > connect this repo. It reads this file.
services:
  - type: web
    name: pixel-games
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
